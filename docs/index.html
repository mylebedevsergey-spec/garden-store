<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <base href="/garden-store/" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сад и Огород, магазин садовых принадлежностей</title>
  <meta name="description" content="Интернет-магазин садовых принадлежностей: инструменты, растения, кашпо и уход за садом." />
  <script>
    // Восстановление маршрута после редиректа с 404.html (GitHub Pages).
    try {
      const saved = sessionStorage.getItem('spa:path');
      if (saved) {
        sessionStorage.removeItem('spa:path');
        history.replaceState({}, '', saved);
      }
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/index.css" />
  <link rel="stylesheet" href="css/components/header.css" />
  <link rel="stylesheet" href="css/components/catalog.css" />
  <link rel="stylesheet" href="css/components/product-card.css" />
  <link rel="stylesheet" href="css/components/cart.css" />
  <link rel="stylesheet" href="css/components/product-page.css" />
  <link rel="stylesheet" href="css/components/canvas-hero.css" />
</head>
<body>
  <canvas id="hero-canvas" class="canvas-hero" aria-hidden="true"></canvas>

  <header class="header">
    <a class="header__logo" href="/" data-link data-route="/">
      <span class="header__logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 20C4 11 10 5 20 4c0 9-6 16-16 16Z" fill="#2f7d4f"/><path d="M6 18C9 13 13 9 18 6" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".8"/></svg></span>
      <span class="header__logo-text">Сад и Огород</span>
    </a>

    <nav class="header__nav" aria-label="Основная навигация">
      <a class="header__link" href="/" data-link data-route="/">Каталог</a>
      <a class="header__link" href="/about" data-link data-route="/about">О магазине</a>
      <a class="header__link" href="/cart" data-link data-route="/cart">Корзина</a>
    </nav>

    <div class="header__actions">
      <button class="header__history" type="button" data-history="back" title="Назад" aria-label="Назад">←</button>
      <button class="header__history" type="button" data-history="forward" title="Вперёд" aria-label="Вперёд">→</button>
      <button class="cart-button" type="button" data-open-cart aria-label="Открыть корзину">
        <span aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#1d2a22" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.4 12h11L21 7H6"/></svg></span>
        <span class="cart-button__count" data-cart-count>0</span>
      </button>
    </div>
  </header>

  <main id="app" class="app" aria-live="polite"></main>

  <footer class="footer">
    <p>Учебный проект, интернет-магазин садовых принадлежностей. HTML, CSS, JavaScript, History API, Canvas, Web Workers.</p>
    <p class="footer__meta">© <span data-year></span> Сад и Огород</p>
  </footer>

  <aside class="cart-drawer" data-cart-drawer aria-hidden="true">
    <div class="cart-drawer__overlay" data-close-cart></div>
    <section class="cart-drawer__panel" role="dialog" aria-modal="true" aria-label="Корзина">
      <header class="cart-drawer__head">
        <h2>Корзина</h2>
        <button class="cart-drawer__close" type="button" data-close-cart aria-label="Закрыть">✕</button>
      </header>
      <div class="cart-drawer__body" data-cart-body></div>
      <footer class="cart-drawer__foot">
        <div class="cart-drawer__row">
          <span>Товары</span><span data-cart-subtotal>0 руб.</span>
        </div>
        <div class="cart-drawer__row">
          <span>Скидка</span><span data-cart-discount>0 руб.</span>
        </div>
        <div class="cart-drawer__row cart-drawer__row--total">
          <span>Итого</span><span data-cart-total>0 руб.</span>
        </div>
        <p class="cart-drawer__note" data-cart-note>Скидка 10% от 5 000 руб., 15% от 10 000 руб.</p>
        <button class="button button--primary button--wide" type="button" data-checkout>Оформить заказ</button>
      </footer>
    </section>
  </aside>

  <div class="toast" data-toast role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
