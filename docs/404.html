<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Сад и Огород</title>
  <script>
    // GitHub Pages отдаёт 404.html на любой неизвестный путь.
    // Запоминаем адрес и возвращаемся на index.html, роутер восстановит маршрут.
    try {
      sessionStorage.setItem('spa:path', location.pathname + location.search + location.hash);
    } catch (e) {}
    location.replace('/garden-store/index.html');
  </script>
</head>
<body></body>
</html>
